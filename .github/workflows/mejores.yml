# Aprender de los mejores: ¿los que más ganan en Hyperliquid siguen ganando después? (datos públicos)
name: Mejores operadores

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * 1,4'   # lunes y jueves a las 5:41 UTC

permissions:
  contents: read

concurrency:
  group: mejores
  cancel-in-progress: false

jobs:
  estudiar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: laboratorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: laboratorio/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas sin red
        run: python pruebas/prueba_mejores.py
      - name: Leer el ranking y los historiales, y estudiar
        run: python -m lab.mejores --salida /tmp/mej --grupo 400
      - uses: actions/upload-artifact@v4
        with:
          name: mejores
          path: /tmp/mej/
          retention-days: 30
      - name: Publicar en el repositorio
        working-directory: .
        run: |
          git config user.name "laboratorio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p resultados/mejores
            cp /tmp/mej/mejores.json /tmp/mej/informe.md resultados/mejores/
            git add resultados/mejores
            git diff --cached --quiet && exit 0
            git commit -q -m "Mejores operadores $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
