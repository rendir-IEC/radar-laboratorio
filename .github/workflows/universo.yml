# Universo de cada momento (D-I2 de la auditoría): todos los perpetuos USDT-M de Binance, también los retirados,
# ordenados cada mes por el volumen del mes anterior; y el aprendizaje automático probado sobre ese universo.
name: Universo sin sesgo

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 5,20 * *'   # los días 5 y 20 de cada mes (Binance publica los archivos mensuales unos días después)

permissions:
  contents: read

concurrency:
  group: universo
  cancel-in-progress: false

jobs:
  universo:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    defaults:
      run:
        working-directory: laboratorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: laboratorio/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas sin red
        run: python pruebas/prueba_universo.py
      - name: Recuperar lo ya descargado
        uses: actions/cache/restore@v4
        with:
          path: laboratorio/datos/universo
          key: universo-${{ github.run_id }}
          restore-keys: universo-
      - name: Descargar lo nuevo, montar el universo de cada momento y probar el modelo
        run: python -m lab.universo --salida /tmp/uni --tops 20 60
      - name: Guardar lo descargado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: laboratorio/datos/universo
          key: universo-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: universo
          path: /tmp/uni/
          retention-days: 30
      - name: Publicar en el repositorio
        working-directory: .
        run: |
          git config user.name "laboratorio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p resultados/universo
            cp /tmp/uni/universo.json /tmp/uni/informe.md resultados/universo/
            git add resultados/universo
            git diff --cached --quiet && exit 0
            git commit -q -m "Universo de cada momento $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
