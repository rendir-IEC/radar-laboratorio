# Aprender de los mejores en Lighter (cuentas públicas): ¿los que ganan siguen ganando?
name: Mejores en Lighter

on:
  workflow_dispatch:
  schedule:
    - cron: '11 6 * * 2,5'   # martes y viernes a las 6:11 UTC

permissions:
  contents: read

concurrency:
  group: lighter
  cancel-in-progress: false

jobs:
  estudiar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: laboratorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: laboratorio/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas sin red
        run: python pruebas/prueba_lighter.py
      - name: Leer cuentas e historiales de Lighter y estudiar
        run: python -m lab.lighter --salida /tmp/lig --min-valor 1000
      - uses: actions/upload-artifact@v4
        with:
          name: lighter
          path: /tmp/lig/
          retention-days: 30
      - name: Publicar en el repositorio
        working-directory: .
        run: |
          git config user.name "laboratorio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p resultados/lighter
            cp /tmp/lig/lighter.json /tmp/lig/informe.md resultados/lighter/
            git add resultados/lighter
            git diff --cached --quiet && exit 0
            git commit -q -m "Mejores en Lighter $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
