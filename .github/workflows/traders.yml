# Aprender de los traders con su historial completo y elegir a quién sigue el servidor (datos públicos)
name: Traders con historial

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 1,2,4,5'   # lunes, martes, jueves y viernes a las 4:23 UTC

permissions:
  contents: read

concurrency:
  group: traders
  cancel-in-progress: false

jobs:
  estudiar:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      contents: write
    defaults:
      run:
        working-directory: laboratorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: laboratorio/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas sin red
        run: python pruebas/prueba_traders.py
      - name: Leer ranking, vaults e historiales; validar y elegir
        run: python -m lab.traders --salida /tmp/tra --grupo 1200 --vaults 300
      - uses: actions/upload-artifact@v4
        with:
          name: traders
          path: /tmp/tra/
          retention-days: 30
      - name: Publicar en el repositorio
        working-directory: .
        run: |
          git config user.name "laboratorio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p resultados/traders
            cp /tmp/tra/traders.json /tmp/tra/seleccion.json /tmp/tra/informe.md resultados/traders/
            git add resultados/traders
            git diff --cached --quiet && exit 0
            git commit -q -m "Traders con historial $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
