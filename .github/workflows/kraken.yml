# Kraken frente a Hyperliquid: costes reales, precios y funding (datos públicos, sin claves)
name: Kraken

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'   # cada día a las 6:17 UTC

permissions:
  contents: read

concurrency:
  group: kraken
  cancel-in-progress: false

jobs:
  comparar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        working-directory: laboratorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: laboratorio/requirements.txt
      - run: pip install -r requirements.txt
      - name: Pruebas sin red
        run: python pruebas/prueba_kraken.py
      - name: Leer Kraken y Hyperliquid y comparar
        run: python -m lab.kraken --salida /tmp/kr
      - uses: actions/upload-artifact@v4
        with:
          name: kraken
          path: /tmp/kr/
          retention-days: 30
      - name: Publicar en el repositorio
        working-directory: .
        run: |
          git config user.name "laboratorio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p resultados/kraken
            cp /tmp/kr/kraken.json /tmp/kr/informe.md resultados/kraken/
            git add resultados/kraken
            git diff --cached --quiet && exit 0
            git commit -q -m "Kraken $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
