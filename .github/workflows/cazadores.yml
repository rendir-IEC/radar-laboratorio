# Examen con la historia de los cazadores de funding del servidor y del cazador entre exchanges (datos públicos)
name: Cazadores con historia

on:
  workflow_dispatch:
  schedule:
    - cron: '43 2 * * 0'   # los domingos a las 2:43 UTC

permissions:
  contents: read

concurrency:
  group: cazadores
  cancel-in-progress: false

jobs:
  examinar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    permissions:
      contents: write
    defaults:
      run:
        working-directory: laboratorio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: laboratorio/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - name: Pruebas sin red (paridad con el servidor)
        run: python pruebas/prueba_cazadores.py
      - name: Recuperar el funding ya descargado
        uses: actions/cache/restore@v4
        with:
          path: laboratorio/datos/cazadores
          key: cazadores-${{ github.run_id }}
          restore-keys: cazadores-
      - name: Descargar y repasar
        run: python -m lab.cazadores --salida /tmp/cz --cache datos/cazadores
      - name: Guardar lo descargado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: laboratorio/datos/cazadores
          key: cazadores-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: cazadores
          path: /tmp/cz/
          retention-days: 30
      - name: Publicar en el repositorio
        working-directory: .
        run: |
          git config user.name "laboratorio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p resultados/cazadores
            cp /tmp/cz/cazadores.json /tmp/cz/informe.md resultados/cazadores/
            git add resultados/cazadores
            git diff --cached --quiet && exit 0
            git commit -q -m "Cazadores con historia $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
